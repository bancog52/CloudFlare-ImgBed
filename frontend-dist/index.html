<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImgHub · Cloudflare R2 图床</title>
  <link rel="stylesheet" href="/app.css?v=7" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>ImgHub</span>
        <span class="badge">Cloudflare R2 图床</span>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="upload">上传台</button>
        <button class="tab-btn" data-tab="gallery">图库管理</button>
      </nav>
      <div class="auth-bar">
        <span id="authStatus" class="auth-status">检查中...</span>
        <button id="authActionBtn" class="btn btn-ghost btn-sm hidden">登录</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 上传台 -->
    <section id="tab-upload" class="tab-panel active">
      <div class="options-bar">
        <label class="field">
          <span>目录</span>
          <input id="uploadFolder" type="text" placeholder="可选，如 blog/2026" />
        </label>
        <label class="field">
          <span>命名</span>
          <select id="uploadNameType">
            <option value="default">随机前缀 + 原名</option>
            <option value="index">纯随机 ID</option>
            <option value="origin">保留原文件名</option>
            <option value="short">短链接 ID</option>
          </select>
        </label>
        <div class="policy-tip" style="color: #b45309; font-weight: 500;">
          ⚠️ 提醒：网页端上传会自动压缩图片（动图保留原格式）且不保存原图，请自行在本地备份原图
        </div>
      </div>

      <div id="dropzone" class="dropzone" tabindex="0">
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
        <div class="dropzone-icon">⬆</div>
        <div class="dropzone-title">拖拽图片到这里，点击选择，或直接 Ctrl + V 粘贴截图</div>
        <div class="dropzone-sub">静态图自动压缩为 ≤2048px WebP(0.8) 存入 R2；动图保留原格式存入 R2（网页端不备份原图）</div>
      </div>

      <div class="results-header">
        <h2>上传记录</h2>
        <div class="results-actions">
          <button id="copyAllMdBtn" class="btn btn-ghost btn-sm" disabled>复制全部 Markdown</button>
          <button id="clearQueueBtn" class="btn btn-ghost btn-sm">清空列表</button>
        </div>
      </div>
      <div id="uploadList" class="upload-list"></div>
    </section>

    <!-- 图库管理 -->
    <section id="tab-gallery" class="tab-panel">
      <div class="gallery-toolbar">
        <input id="searchInput" type="search" placeholder="搜索文件名..." />
        <input id="dirInput" type="text" placeholder="目录过滤，如 blog" />
        <button id="refreshGalleryBtn" class="btn btn-primary btn-sm">刷新</button>
        <span id="galleryCount" class="gallery-count">共 0 张</span>
      </div>

      <div id="galleryGrid" class="gallery-grid"></div>

      <div class="pagination">
        <button id="prevPageBtn" class="btn btn-ghost btn-sm" disabled>上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button id="nextPageBtn" class="btn btn-ghost btn-sm" disabled>下一页</button>
      </div>
    </section>
  </main>

  <!-- 登录弹窗 -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-card">
      <h3>登录 ImgHub</h3>
      <form id="loginForm">
        <input id="loginPassword" type="password" placeholder="请输入访问密码" required autocomplete="current-password" />
        <div id="turnstileBox"></div>
        <div class="modal-actions">
          <button type="button" id="closeLoginModal" class="btn btn-ghost">取消</button>
          <button type="submit" class="btn btn-primary">确认登录</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 大图预览弹窗 -->
  <div id="previewModal" class="modal hidden">
    <div class="preview-wrap">
      <img id="previewImg" alt="preview" />
      <div class="preview-bar">
        <span id="previewMeta"></span>
        <button id="closePreviewModal" class="btn btn-ghost btn-sm">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/app.js?v=7"></script>
</body>
</html>
